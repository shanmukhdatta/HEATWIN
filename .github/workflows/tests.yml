name: Phase 1 Python checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
            requirements-dev.txt
      - name: Install package and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip check
      - name: Run unit tests
        run: python -m pytest -q
      - name: Run Ruff
        run: python -m ruff check .

      - name: Smoke-test Streamlit placeholder
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest

          app = AppTest.from_file("app.py").run(timeout=20)
          assert not app.exception, [str(exc.message) for exc in app.exception]
          assert any("HEATWIN" in item.value for item in app.title)
          assert any("55" in str(item.value) for item in app.metric)
          PY
