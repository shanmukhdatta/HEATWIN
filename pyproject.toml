[build-system]
requires = ["setuptools>=69,<83", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "heatwin"
version = "0.1.0"
description = "Foundation for a software-only heat exchanger digital twin and PID control project"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=1.26.4,<3",
    "scipy>=1.12,<2",
    "pandas>=2.2,<3",
    "matplotlib>=3.8,<4",
    "control>=0.10.1,<0.11",
    "streamlit>=1.39,<2",
    "plotly>=5.24,<7",
    "PyYAML>=6.0.2,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10",
    "pytest-cov>=5,<8",
    "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
